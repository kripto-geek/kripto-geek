<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22d3ee"/>
      <stop offset="0.7" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="5.5" width="1200" height="1" fill="url(#dg)"/>
  <circle cy="6" r="2.6" fill="#ffffff" filter="url(#dglow)">
    <animate attributeName="cx" from="-16" to="1216" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
